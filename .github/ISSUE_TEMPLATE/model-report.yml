name: Model report
description: Tell us how NitroRust works on your Acer laptop, so your model can be added.
title: "Model report: "
labels: ["model report"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping. In NitroRust, **Report this model** (or **Report a problem** in Advanced) fills in most of this for you.
  - type: input
    id: model
    attributes:
      label: Laptop model
      description: For example "Nitro AN515-58". NitroRust shows it in the banner.
    validations:
      required: true
  - type: checkboxes
    id: works
    attributes:
      label: What works
      options:
        - label: Temperatures look right
        - label: Auto and Max fan modes
        - label: The fan test passed
        - label: Quiet / Balanced / Cool and my own curve
        - label: Keyboard colour and brightness
        - label: Keyboard effects (wave, breathing...)
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: From the "Copy diagnostics" button. It has no personal details (no user name, serial number or file paths).
      render: text
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Anything else
      description: What didn't work, or what looked wrong.
