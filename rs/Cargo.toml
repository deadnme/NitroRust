[package]
name = "nitrorust"
version = "1.2.0"
description = "Lightweight NitroSense replacement for Acer Nitro laptops"
license = "MIT"
edition = "2021"

[dependencies]
slint = { version = "1.18.1", default-features = false, features = ["std", "compat-1-2", "backend-winit", "renderer-software", "accessibility", "system-tray", "unstable-winit-030"] }
serde = { version = "1.0.229", features = ["derive"] }
windows-sys = { version = "0.61.2", features = ["Win32_System_Power", "Win32_Foundation", "Win32_System_Registry", "Win32_System_Threading", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_UI_WindowsAndMessaging", "Win32_UI_Controls_Dialogs", "Win32_Graphics_Gdi", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_UI_Shell", "Win32_UI_HiDpi", "Win32_System_SystemInformation"] }
wmi = "0.18.4"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[build-dependencies]
embed-resource = "3.0.12"
slint-build = "1.18.1"
